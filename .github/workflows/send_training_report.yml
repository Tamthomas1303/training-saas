name: Send Training Report

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'Loai bao cao'
        required: true
        default: 'week'
        type: choice
        options:
          - week
          - month
  schedule:
    # Bao cao TUAN: moi thu Hai, 1h UTC = 8h sang gio VN (UTC+7).
    - cron: '0 1 * * 1'
    # Bao cao THANG: mung 1 hang thang, 1h UTC = 8h sang gio VN.
    - cron: '0 1 1 * *'

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: 'False'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      # secrets khong ton tai se thanh chuoi rong (khong phai bien vang mat) - '' se de len
      # gia tri mac dinh cua settings.py (vd int('') crash) - fallback || cho cac bien co
      # gia tri mac dinh khac rong (xem alert_no_training.yml, cung loi da gap va sua).
      EMAIL_PORT: ${{ secrets.EMAIL_PORT || '587' }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS || 'True' }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL || secrets.EMAIL_HOST_USER || 'no-reply@training.local' }}
      REPORT_TO: ${{ secrets.REPORT_TO }}
      REPORT_CC: ${{ secrets.REPORT_CC }}
      TRAINING_DATA_CSV_URL: ${{ secrets.TRAINING_DATA_CSV_URL }}
      SERVICE_AUDIT_CSV_URL: ${{ secrets.SERVICE_AUDIT_CSV_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Xac dinh loai bao cao (tuan/thang) theo lich vua kich hoat
        id: kind
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 1 1 * *" ]; then
            echo "kind=month" >> "$GITHUB_OUTPUT"
          else
            echo "kind=week" >> "$GITHUB_OUTPUT"
          fi
      - run: python manage.py send_training_report --kind ${{ steps.kind.outputs.kind }}
