<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SCORM</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #scorm-frame { width: 100%; height: 100%; border: 0; display: block; }
  #scorm-status { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 24px; color: #666; font-size: 14px; }
</style>
</head>
<body>
<div id="scorm-status">Đang tải bài học...</div>
<iframe id="scorm-frame" title="SCORM content" style="display:none"></iframe>
<script src="{{ lib_url }}"></script>
<script>
(function () {
  "use strict";
  // CONFIG duoc server render san (id/duong dan cong khai, khong nhay cam) - xem
  // courses/views.py::scorm_player. token (JWT) do trang React nhung THU NAY vao iframe
  // truyen qua URL FRAGMENT (#token=...) - khong len server qua query string.
  var CONFIG = {{ config_json|safe }};
  var hashParams = new URLSearchParams((window.location.hash || "").replace(/^#/, ""));
  var token = hashParams.get("token") || "";
  var statusEl = document.getElementById("scorm-status");
  var frameEl = document.getElementById("scorm-frame");

  function authHeaders() {
    return token ? { Authorization: "Bearer " + token } : {};
  }

  function showError(message) {
    statusEl.textContent = message;
    statusEl.style.display = "block";
    frameEl.style.display = "none";
  }

  function buildSettings() {
    return {
      autocommit: true,
      autocommitSeconds: 20,
      renderCommonCommitFields: true,
      sendFullCommit: true,
      lmsCommitUrl: CONFIG.commitUrl,
      xhrHeaders: authHeaders(),
      // useAsynchronousCommits mac dinh false -> thu vien dung XHR DONG BO (dung chuan SCORM),
      // goi xhrResponseHandler (KHONG phai responseHandler, cai do chi dung khi bat async).
      xhrResponseHandler: function () {
        return { result: true, errorCode: 0 };
      },
      // Bao ve trang React ben ngoai (postMessage - cross-origin an toan) ngay khi 1 commit
      // hoan thanh dang duoc gui di, de UI (% tien do, nut) cap nhat REAL-TIME thay vi phai
      // doi hoc vien tu tay tai lai trang. Backend van la nguon su that (ghi qua commitUrl).
      requestHandler: function (commitObject) {
        if (commitObject && (commitObject.completionStatus === "completed" || commitObject.successStatus === "passed")) {
          try {
            window.parent.postMessage({ type: "scorm-completed" }, "*");
          } catch (e) {
            // Khong co parent (mo truc tiep trang nay de debug) - bo qua.
          }
        }
        return commitObject;
      },
    };
  }

  function startContent() {
    frameEl.src = CONFIG.contentUrl;
    frameEl.style.display = "block";
    statusEl.style.display = "none";
  }

  fetch(CONFIG.stateUrl, { headers: authHeaders() })
    .then(function (r) { return r.ok ? r.json() : { cmi_json: {} }; })
    .catch(function () { return { cmi_json: {} }; })
    .then(function (state) {
      var settings = buildSettings();
      var api;
      if (CONFIG.isScorm2004) {
        api = new Scorm2004API(settings);
        window.API_1484_11 = api;
      } else {
        api = new Scorm12API(settings);
        window.API = api;
      }
      if (state && state.cmi_json && Object.keys(state.cmi_json).length > 0) {
        try {
          api.loadFromJSON(state.cmi_json);
        } catch (e) {
          // Du lieu resume cu khong doc duoc (vd doi phien ban thu vien) - bo qua, hoc lai tu dau.
        }
      }
      startContent();
    })
    .catch(function () {
      showError("Không tải được bài học SCORM. Vui lòng thử lại.");
    });
})();
</script>
</body>
</html>
